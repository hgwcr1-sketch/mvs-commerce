<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>MVS Commerce - Offline</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; background: #f1f5f9; color: #111827; }
        button, input { font: inherit; }
        button { min-height: 44px; cursor: pointer; }
        [hidden] { display: none !important; }
        .shell { min-height: 100vh; }
        .shell-header { background: #111827; color: #fff; padding: 1rem; }
        .shell-header strong { display: block; font-size: 1.1rem; }
        .shell-header small { color: #d4af37; }
        .shell-main { width: min(100% - 1.5rem, 72rem); margin: 0 auto; padding: 1rem 0 6rem; }
        .shell-status, .shell-section { background: #fff; border: 1px solid #cbd5e1; border-radius: .75rem; padding: 1rem; margin-bottom: .75rem; }
        .shell-status[data-state="blocked"] { border-color: #dc2626; }
        .shell-status[data-state="ready"] { border-color: #d4af37; }
        .shell-grid { display: grid; gap: .75rem; }
        .shell-search { display: flex; gap: .5rem; }
        .shell-search input { flex: 1; min-width: 0; border: 2px solid #cbd5e1; border-radius: .75rem; padding: .7rem .8rem; }
        .shell-search button, .shell-action { border: 0; border-radius: .65rem; padding: .65rem .9rem; background: #d4af37; color: #111827; font-weight: 700; }
        .shell-list { display: grid; gap: .5rem; margin-top: .75rem; }
        .shell-item { display: flex; align-items: center; justify-content: space-between; gap: .75rem; border: 1px solid #e2e8f0; border-radius: .65rem; padding: .7rem; }
        .shell-item button { flex: 0 0 auto; border: 1px solid #b1922d; border-radius: .5rem; background: #fff8db; padding: .45rem .7rem; }
        .shell-cart-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem; align-items: center; padding: .65rem 0; border-bottom: 1px solid #e2e8f0; }
        .shell-cart-row input { width: 4.5rem; padding: .45rem; border: 1px solid #cbd5e1; border-radius: .4rem; text-align: center; }
        .shell-muted { color: #64748b; }
        .shell-error { color: #b91c1c; white-space: pre-wrap; }
        @media (min-width: 768px) { .shell-grid { grid-template-columns: 1fr 1fr; } .shell-main { padding-top: 1.5rem; } }
    </style>
</head>
<body>
    <div id="mvs-offline-shell" class="shell">
        <header class="shell-header">
            <strong>MVS Commerce</strong>
            <small>Modo Offline</small>
        </header>
        <main class="shell-main">
            <section id="mvs-offline-status" class="shell-status" data-state="loading" aria-live="polite">
                <strong id="mvs-offline-status-title">Validando terminal...</strong>
                <p id="mvs-offline-status-detail" class="shell-muted">La autorización se verifica localmente.</p>
            </section>
            <section id="mvs-offline-pos" hidden>
                <div class="shell-section">
                    <strong id="mvs-offline-context"></strong>
                    <p id="mvs-offline-auth" class="shell-muted"></p>
                </div>
                <div class="shell-grid">
                    <section class="shell-section">
                        <h2>Productos</h2>
                        <div class="shell-search"><input id="mvs-offline-product-query" type="search" autocomplete="off" placeholder="Nombre, código o barra"><button id="mvs-offline-product-search" type="button">Buscar</button></div>
                        <div id="mvs-offline-product-results" class="shell-list" aria-live="polite"></div>
                    </section>
                    <section class="shell-section">
                        <h2>Clientes</h2>
                        <div class="shell-search"><input id="mvs-offline-customer-query" type="search" autocomplete="off" placeholder="Nombre, identificación o código"><button id="mvs-offline-customer-search" type="button">Buscar</button></div>
                        <div id="mvs-offline-customer-results" class="shell-list" aria-live="polite"></div>
                    </section>
                </div>
                <section class="shell-section">
                    <h2>Carrito</h2>
                    <div id="mvs-offline-cart"><p class="shell-muted">Seleccione productos para construir el carrito.</p></div>
                    <strong id="mvs-offline-cart-total"></strong>
                    <p class="shell-muted">El cobro Offline requiere una sesión de caja recuperable. La apertura/cierre Offline pertenece a 4B.1D.</p>
                    <button id="mvs-offline-checkout" class="shell-action" type="button" disabled title="Caja Offline pendiente">Cobro bloqueado</button>
                </section>
            </section>
        </main>
    </div>
    <script type="module" src="/offline-shell.js"></script>
</body>
</html>
