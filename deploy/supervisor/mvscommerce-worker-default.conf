; Worker general limitado: solo cola default (venta, mail, caja, cron jobs
; que no declaran cola). NO debe consumir la cola fiscal (Emit/Poll van a
; fiscal: ver mvscommerce-fiscal-worker.conf).
;
; Instalacion (produccion, solo con aprobacion):
;   sudo cp deploy/supervisor/mvscommerce-worker-default.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; El comando actual de produccion corre sin --queue y por eso roba la cola
; fiscal: hay que reemplazarlo por este (con --queue=default).
; Verificar con: sudo supervisorctl status

[program:mvscommerce-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mvscommerce/artisan queue:work --queue=default --tries=3 --timeout=600 --sleep=3 --max-time=3600
directory=/var/www/mvscommerce
user=mvsadmin
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/mvscommerce/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",QUEUE_CONNECTION="database"
