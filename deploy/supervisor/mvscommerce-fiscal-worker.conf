; Worker fiscal dedicado — cola fiscal aislada de default/mail.
; Instalación (producción, solo con aprobación):
;   sudo cp deploy/supervisor/mvscommerce-fiscal-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; REGLA DE AISLAMIENTO: el worker default/mail NO debe consumir la cola fiscal.
; Si el worker default corre sin --queue, debe pasársele explícitamente
;   --queue=default,mail  (o las colas que use), nunca todas.
; Verificar con: sudo supervisorctl status

[program:mvscommerce-fiscal-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mvscommerce/artisan queue:work --queue=fiscal --tries=3 --timeout=120 --sleep=3 --max-time=3600
directory=/var/www/mvscommerce
user=mvsadmin
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/mvscommerce/storage/logs/worker-fiscal.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",QUEUE_CONNECTION="database"
